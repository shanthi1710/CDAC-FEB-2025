<!DOCTYPE html>
<html>
<head>
    <title>Day of Week</title>
</head>
<body>
    <h1 id="dayDisplay"></h1>
    
    <script>
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const today = new Date();
        document.getElementById('dayDisplay').textContent = `Today is ${days[today.getDay()]}`;
    </script>
</body>
</html>
