<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q7</title>
    <script>
        var a = prompt("Enter a number:->");
        var n = prompt("Enter range:->");

        for(let i=1;i<=n;i++){
            let res = a*i;
            document.write(a + " * " + i + " = " + res+" " );
        }
    </script>
</head>
