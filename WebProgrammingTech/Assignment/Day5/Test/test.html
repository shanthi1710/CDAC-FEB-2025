<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fruit List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        #fruitList {
            margin-top: 20px;
        }
        li {
            margin: 5px 0;
            padding: 5px;
            background-color: #f0f0f0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h2>Fruit List App</h2>
    <div>
        <input type="text" id="fruitInput" placeholder="Enter a fruit name">
        <button onclick="addFruit()">Add Fruit</button>
    </div>
    <ul id="fruitList"></ul>

    <script>
        function addFruit() {
            // Get the input value
            const fruitInput = document.getElementById('fruitInput');
            const fruitName = fruitInput.value.trim();
            
            // Validate input
            if (fruitName === '') {
                alert('Please enter a fruit name');
                return;
            }
            
            // Add to the list
            const fruitList = document.getElementById('fruitList');
            const listItem = document.createElement('li');
            listItem.textContent = fruitName;
            fruitList.appendChild(listItem);
            
            // Clear the input field
            fruitInput.value = '';
            fruitInput.focus();
        }
        
        // Allow adding fruits by pressing Enter key
        document.getElementById('fruitInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addFruit();
            }
        });
    </script>
</body>
</html>
