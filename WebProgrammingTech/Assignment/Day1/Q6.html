<!DOCTYPE html>
<html>
  <head>
    <title>January Calendar</title>
    <style>
      table {
        border-collapse: collapse;
        width: 60%;
        text-align: center;
        font-family: Arial, sans-serif;
      }

      th,
      td {
        border: 1px solid #333;
        padding: 10px;
        width: 40px;
        height: 40px;
      }

      th {
        background-color: #ff0;
      }

      .sun {
        background-color: #f0c;
      }
      .mon {
        background-color: #f0c;
      }
      .tue {
        background-color: #f0c;
      }
      .wed {
        background-color: #f0c;
      }
      .thu {
        background-color: #f0c;
      }
      .fri {
        background-color: #f0c;
      }
      .sat {
        background-color: #0ff;
      }

      .holiday {
        background-color: green;
        color: white;
      }
      .special {
        background-color: yellow;
        color: black;
      }
    </style>
  </head>
  <body>
    <div align="center">
      <h2>January</h2>
    </div>
    <div>
      <table align="center">
        <tr>
          <th class="sun">Sun</th>
          <th class="mon">Mon</th>
          <th class="tue">Tue</th>
          <th class="wed">Wed</th>
          <th class="thu">Thu</th>
          <th class="fri">Fri</th>
          <th class="sat">Sat</th>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td class="special">1</td>
          <td class="sat">2</td>
        </tr>
        <tr>
          <td class="holiday">3</td>
          <td>4</td>
          <td>5</td>
          <td>6</td>
          <td>7</td>
          <td>8</td>
          <td class="sat">9</td>
        </tr>
        <tr>
          <td class="holiday">10</td>
          <td>11</td>
          <td>12</td>
          <td>13</td>
          <td>14</td>
          <td>15</td>
          <td class="sat">16</td>
        </tr>
        <tr>
          <td class="holiday">17</td>
          <td>18</td>
          <td>19</td>
          <td>20</td>
          <td>21</td>
          <td>22</td>
          <td class="sat">23</td>
        </tr>
        <tr>
          <td class="holiday">24</td>
          <td>25</td>
          <td class="special">26</td>
          <td>27</td>
          <td>28</td>
          <td>29</td>
          <td class="sat">30</td>
        </tr>
        <tr>
          <td class="holiday">31</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </table>
    </div>
  </body>
</html>
