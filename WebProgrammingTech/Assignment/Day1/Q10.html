<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pizza Shop 2.0</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 30px;
        display: flex;
        justify-content: center;
      }

      table {
        border-collapse: separate;
        border-spacing: 2px;
        width: 400px;
      }

      td,
      th {
        border: 1px solid black;
        padding: 8px;
        vertical-align: top;
      }

      th {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
      }

      textarea {
        width: 100%;
        height: 100px;
      }

      button {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <form>
      <table>
        <tr>
          <th colspan="2">Pizza Shop 2.0</th>
        </tr>
        <tr>
          <td>Name</td>
          <td><input type="text" name="customerName" /></td>
        </tr>
        <tr>
          <td>Pizza Topping</td>
          <td>
            <input type="radio" name="topping" value="supreme" /> Supreme<br />
            <input type="radio" name="topping" value="vegetarian" />
            Vegetarian<br />
            <input type="radio" name="topping" value="hawaiian" /> Hawaiian
          </td>
        </tr>
        <tr>
          <td>Pizza Sauce</td>
          <td>
            <select name="sauce">
              <option value="tomato">Tomato</option>
              <option value="bbq">BBQ</option>
              <option value="garlic">Garlic</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Optional Extras</td>
          <td>
            <input type="checkbox" name="extras" value="cheese" /> Extra Cheese
            <input type="checkbox" name="extras" value="glutenFree" /> Gluten
            Free Base
          </td>
        </tr>
        <tr>
          <td colspan="2">
            Delivery Instructions:<br />
            <textarea name="instructions"></textarea>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <button type="submit">Send my Order</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
