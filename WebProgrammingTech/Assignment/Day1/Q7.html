<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Order Receipt</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      .wrapper {
        display: flex;
        justify-content: center;
        margin-top: 60px;
      }

      table {
        border-collapse: collapse;
        width: 600px;
      }

      td,
      th {
        border: 1px solid black;
        padding: 8px;
        vertical-align: top;
      }

      .label {
        font-weight: bold;
      }

      .center {
        text-align: center;
      }

      .right {
        text-align: right;
      }

      .tcb-cell {
        text-align: center;
        vertical-align: middle;
        font-weight: bold;
      }

      .order-details {
        width: 100%;
        border-collapse: collapse;
      }

      .order-details td {
        border: 1px solid black;
        padding: 8px;
      }

      .no-padding {
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <table>
        <tr>
          <td rowspan="6" class="tcb-cell">TCB</td>
          <td class="label">Order no:</td>
          <td>#ABC001</td>
        </tr>
        <tr>
          <td class="label">Order Date:</td>
          <td>23-Mar-2016</td>
        </tr>
        <tr>
          <td colspan="2" class="center label">Customer</td>
        </tr>
        <tr>
          <td class="label">Name:</td>
          <td>John Papas</td>
        </tr>
        <tr>
          <td class="label">Address:</td>
          <td>Independence Day 5th str, 11511</td>
        </tr>
        <tr>
          <td colspan="2" class="center label">Order Details</td>
        </tr>
        <tr>
          <td colspan="3" class="no-padding">
            <table class="order-details">
              <tr>
                <td>1</td>
                <td>Of Mice and Men</td>
                <td>Book</td>
                <td>10.00€</td>
              </tr>
              <tr>
                <td>2</td>
                <td>Les Miserables</td>
                <td>Book</td>
                <td>12.00€</td>
              </tr>
              <tr>
                <td>3</td>
                <td>Game of Thrones - S01</td>
                <td>DVD</td>
                <td>50.00€</td>
              </tr>
              <tr>
                <td>4</td>
                <td>Samsung Galaxy</td>
                <td>Mobile Phone</td>
                <td>200.00€</td>
              </tr>
              <tr>
                <td colspan="3" class="right label">Total:</td>
                <td>272.00€</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
