<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container-fluid">
  <div class="row text-center px-5 py-5 ">
<div class="fs-1"><i class="bi bi-bootstrap-fill "></i></div>
    <div class="col-12 text-center fs-3">
        <b>Checkout form</b>
        <p class="fs-5">Below is an example form built entirely with Bootstrap’s form controls. Each required form group has a validation state that can be triggered by attempting to submit the form without completing it.</p>
   </div>
  </div>
  <div class="row">
    <div class="col-8 border-bottom border-2">
        Billing address
        <form class="row g-3">
  <div class="col-md-6">
    <label for="inputfirstname" class="form-label">First Name</label>
    <input type="First name" class="form-control" id="inputfirstname">
  </div>
  <div class="col-md-6">
    <label for="inputlastname" class="form-label">Last Name</label>
    <input type="Last name" class="form-control" id="inputlastname">
  </div>
  <div class="col-12">
    <label for="email" class="form-label">Email(optional)</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="you@example.com">
  </div>
  <div class="col-12">
    <label for="inputAddress" class="form-label">Address</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
  </div>
  <div class="col-12">
    <label for="inputAddress2" class="form-label">Address 2</label>
    <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
  </div>
  <div class="col-md-6">
    <label for="inputCountry" class="form-label">Country</label>
    <select id="inputState" class="form-select">
      <option selected>Choose...</option>
      <option>...</option>
    </select>
  </div>


  <div class="col-md-4">
    <label for="inputState" class="form-label">State</label>
    <select id="inputState" class="form-select">
      <option selected>Choose...</option>
      <option>...</option>
    </select>
  </div>
  <div class="col-md-2">
    <label for="inputZip" class="form-label">Zip</label>
    <input type="text" class="form-control" id="inputZip">
  </div>
  <hr>
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
        Shipping address is the same as my billing address
      </label>
    </div>
  </div>
<div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
        Save this information for next time
      </label>
    </div>
  </div>

  <hr>
   <h4>Payment</h4>
  <div class="form-check">
   
  <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
  <label class="form-check-label" for="radioDefault1">
    Credit card
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
  <label class="form-check-label" for="radioDefault2">
    Debit card
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
  <label class="form-check-label" for="radioDefault2">
   PayPal
  </label>
</div>

<div class="col-md-6">
    <label for="inputNameonCard" class="form-label">Name on Card</label>
    <input type="First name" class="form-control" id="inputfirstname">
  </div>
  <div class="col-md-6">
    <label for="creditcard" class="form-label">Credit card number</label>
    <input type="Last name" class="form-control" id="inputlastname">
  </div>

<div class="col-md-3">
    <label for="Expiration" class="form-label">Name on Card</label>
    <input type="First name" class="form-control" id="inputfirstname">
  </div>
  <div class="col-md-3">
    <label for="" class="form-label">Credit card number</label>
    <input type="Last name" class="form-control" id="inputlastname">
  </div>
  <hr>

   <div class="d-grid gap-2">
  <button class="btn btn-primary" type="button">CheckOut</button>
  
</div>
  
</form>


    </div>



    <div class="col-4"></div>

  </div>
</div>
    
</body>
</html>
