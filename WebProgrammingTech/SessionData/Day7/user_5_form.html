<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
    <script>
        
        function save(event){
            event.preventDefault()
            var email = event.target.email.value
            var name = event.target.name.value
            var dob = event.target.dob.value
            var gender = event.target.gender.value
            var langArr = event.target.language
            var lang = [] // to store checked values
            for(i =0; i<langArr.length; i++){
                if(langArr[i].checked){
                    lang.push(langArr[i].value)
                }
            }
            var country = event.target.country.value
            console.log(lang)
            var htmlStr = `<tr>
                    <td>${name}</td>
                    <td>${email}</td>
                    <td>${dob}</td>
                    <td>${gender}</td>
                    <td>${lang}</td>
                    <td>${country}</td>
            </tr>` 
            document.getElementById("tabledata").innerHTML += htmlStr 
        }

    </script>
  </head>
  <body class="bg-secondary-subtle">
    <div class="container-fluid">
      <div class="row align-items-center justify-content-center" style="height: 98vh">
        <div class="col-4">
          <form id="form" class="block shadow p-4 rounded-2">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" id="name" name="name" class="form-control form-control-sm" />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="text" id="email" name="email" class="form-control form-control-sm" />
            </div>
            <div class="mb-3">
              <label for="dob" class="form-label">DOB</label>
              <input type="date" id="dob"  name="dob" class="form-control form-control-sm" />
            </div>
            <!-- radio button  -->
            <div class="mb-3">
              <label for="gender" class="form-label">Gender</label>
              <input type="radio" name="gender" value="male"> Male
              <input type="radio" name="gender" value="female"> Female
            </div>
            <!-- checkbox button -->
             <div class="mb-3">
              <label for="language" class="form-label">Language</label>
              <input type="checkbox" name="language" value="Hindi"> Hindi
              <input type="checkbox" name="language" value="Marathi"> Marathi
              <input type="checkbox" name="language" value="English"> English
            </div>
            <!-- Select Tag -->
             <div class="mb-3">
                <label for="country" class="form-label">Country</label>
                <select id="country" name="country" class="form-select">
                    <option value="India">India</option>
                    <option value="US">US</option>
                </select>
             </div>
            <div class="mb-3 mt-3 text-center">
                <button class="btn btn-sm btn-outline-primary">Save</button>
            </div>
          </form>
        </div>
        <div class="col-6 p-4 overflow-x-scroll">
            <table class="table table-stripped table-hover">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>DOB</th>
                        <th>Gender</th>
                        <th>Language</th>
                        <th>Country</th>
                    </tr>
                </thead>
                <tbody id="tabledata">

                </tbody>
            </table>
        </div>
      </div>
    </div>
    <script>
    
      //document.getElementById("btn1").addEventListener('click',save)
      document.getElementById("form").addEventListener('submit',save)
    </script>
  </body>
</html>
