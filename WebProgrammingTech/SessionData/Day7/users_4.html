<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
    <script>
        
        function save(){
            var name = document.getElementById("name").value
            var email = document.getElementById("email").value
            var dob = document.getElementById("dob").value 
            // Fetching radio button dom's by name
            var genderArr = document.getElementsByName("gender")
            var gender = ""
            if(genderArr[0].checked){
              gender = genderArr[0].value
            }else if(genderArr[1].checked){
              gender = genderArr[1].value
            }
            var htmlStr = `<tr>
                    <td>${name}</td>
                    <td>${email}</td>
                    <td>${dob}</td>
                    <td>${gender}</td>
            </tr>` 
            document.getElementById("tabledata").innerHTML += htmlStr 
        }

    </script>
  </head>
  <body class="bg-secondary-subtle">
    <div class="container-fluid">
      <div class="row align-items-center justify-content-center" style="height: 98vh">
        <div class="col-4">
          <div class="block shadow p-4 rounded-2">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" id="name" class="form-control form-control-sm" />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="text" id="email" class="form-control form-control-sm" />
            </div>
            <div class="mb-3">
              <label for="dob" class="form-label">DOB</label>
              <input type="date" id="dob" class="form-control form-control-sm" />
            </div>
            <!-- radio button  -->
            <div class="mb-3">
              <label for="gender" class="form-label">Gender</label>
              <input type="radio" name="gender" value="male"> Male
              <input type="radio" name="gender" value="female"> Female
            </div>
            <div class="mb-3 mt-3 text-center">
                <button onclick="save()" class="btn btn-sm btn-outline-primary">Save</button>
            </div>
          </div>
        </div>
        <div class="col-6 p-4">
            <table class="table table-stripped table-hover">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>DOB</th>
                        <th>Gender</th>
                    </tr>
                </thead>
                <tbody id="tabledata">

                </tbody>
            </table>
        </div>
      </div>
    </div>
  </body>
</html>
