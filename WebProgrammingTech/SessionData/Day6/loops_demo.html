<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <script>
        var x; //undefined
        let y = null; // undefined
        console.log(x,y) 
        //Loops
        var x = 2;
        for(i = 0; i < 11; i++){
            console.log(i*x)
            document.write("<h4>"+i*x + "</h4>") // <h4>2</h4>...
        }
        var i = 1
        while(i < 11){
            console.log(i * x);
            i++;
        }

        var i = 1;
        do{
            console.log(i * x);
            i++;
        }while(i < 11)
        //Switch case
        var x = Number(prompt("Enter the number"))
        switch(x){
            case 1 : document.write("Monday")
                break;
            case 2 : document.write("Tuesday")
                break;
            case 3 : document.write("Wednesday")
                break;
            case 4 : document.write("Thursday")
                break;
            default: 
                document.write("Invalid value")

        }
        //0,undefined,null,"",false,NaN

    </script>
