<html>
<head>
  <style>
    .input-control{
          width: 100%;
    }
    .block{
      margin-bottom : 10px;
    }
    .container{
      width: 350px;
      background-color: beige;
      box-shadow: 9px 9px 25px -13px black;
    }
    .border {
      border: 1px solid black;
      padding: 10px;
      margin: 10px;
      border-radius: 15px;
    }
    .last_div{
      text-align:center;
    }
    .btn{
      background-color: blue;
      color: white;
      border: 0px;
      padding: 5px;
      padding-left: 20px;
      padding-right: 20px;
    }
    .btn:hover{
      background-color: green;
      padding:3px;
    }
    
    
    
    
  </style>
</head>
<body>
  <div class="border container">
    <div class="block">
      <label>Name</label>
      <br>
      <input type = "text" class="input-control">
    </div>
    <div class="block">
      <label>Email</label>
      <br>
      <input type = "text" class="input-control">
    </div>
    <div class="block">
      <label>Gender</label>
      <br>
      <input type ="radio" name = "gender"/>male
      <input type ="radio" name ="gender"/>female
    </div>
    <div class="block">
      <label>Marital Status</label> 
      <br>
      <select class="input-control">
        <option>single</option>
        <option>married</option>
      </select>
    </div>
    <div class=" block last_div">
        <button class="btn">Save</button>
    </div>
  </div>
</body>
</html>
