<html>
  <head>
    <style>
      .main-container{
        height: 98vh;
        /*border: 1px solid black;*/
        display:flex;
        justify-content: center;
        align-items:center;
      }
      .input-control{
          width: 100%;
    }
    .container{
      width: 25rem;
      background-color: beige;
      box-shadow: 0.8rem 0.8rem 2rem -1rem black;
    }
    .border {
      border: 1px solid black;
      padding: 10px;
      margin: 10px;
      border-radius: 15px;
    }
    .last_div{
      text-align:center;
    }
    .btn{
      background-color: blue;
      color: white;
      border: 0px;
      padding: 5px;
      padding-left: 20px;
      padding-right: 20px;
    }
    .btn:hover{
      background-color: green;
      padding:3px;
    }
    
    
    </style>
  </head>
<body>
  <div class="main-container">
    <div class="border container">
    <div class="border">
      <label>Name</label>
      <br>
      <input type = "text" class="input-control">
    </div>
    <div class="border">
      <label>Email</label>
      <br>
      <input type = "text" class="input-control">
    </div>
    <div class="border">
      <label>Gender</label>
      <br>
      <input type ="radio" name = "gender"/>male
      <input type ="radio" name ="gender"/>female
    </div>
    <div class="border">
      <label>Marital Status</label> 
      <br>
      <select class="input-control">
        <option>single</option>
        <option>married</option>
      </select>
    </div>
    <div class="border last_div">
        <button class="btn">Save</button>
    </div>
  </div>
  </div>
</body>
</html>
