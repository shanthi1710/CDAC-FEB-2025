<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
  body{
    background-color : yellow;
  }

</style>
</head>
<body >
  <div class="container" >
    <div class="row justify-content-center align-items-center" style="height:98vh">
      <div class="shadow rounded-2 p-4" style="width: 25rem ">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter username here">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="*********************">
          </div>
          <div class="mb-3">
            <label class="form-label">Martial Status</label>
            <select class="form-select">
              <option>Single</option>
              <option>Married</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Gender</label>
            <div class="form-check">
              <input type="radio" class="form-check-input" name="gender">
              <label class="form-check-label">Male</label>
            </div>
            <div class="form-check">
              <input type="radio" class="form-check-input" name="gender">
              <label class="form-check-label">Female</label>
            </div>
          </div>
          <div class="mb-3 text-center">
            <button class="btn btn-primary px-5">Save</button>
          </div>
      </div>
    </div>
  </div>
</body>
</html>
